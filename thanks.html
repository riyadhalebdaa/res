<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شكرًا لك</title>
<style>
body{margin:0;background:#f5f7fa;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:#1f2937}
.card{width:min(620px,calc(100% - 32px));margin:90px auto;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:42px 28px;text-align:center;box-shadow:0 10px 30px rgba(31,41,55,.08)}
.emoji{font-size:64px}
h1{margin:12px 0 8px}
p{color:#6b7280}
a{display:inline-block;margin-top:16px;background:#355c7d;color:#fff;text-decoration:none;padding:11px 22px;border-radius:10px;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <div class="emoji">✅</div>
  <h1>شكرًا لمشاركتك</h1>
  <p>تم إرسال إجاباتك بنجاح، ونقدّر وقتك ورأيك.</p>
  </div>
</body>
</html>
